name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.31"
          python-version: "3.12"
          enable-cache: true
          prune-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-groups --extra dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Check formatting
        run: uv run ruff format --check src tests
      - name: Type check
        run: uv run ty check src/therapist
      - name: Test with branch coverage
        run: |
          uv run coverage run -m pytest -q
          uv run coverage report
      - name: Validate protocol packs
        run: uv run thera protocol validate
      - name: Validate installer syntax
        run: |
          sh -n install.sh
          pwsh -NoProfile -Command '$null = [scriptblock]::Create((Get-Content -Raw install.ps1))'
      - name: Build package
        run: uv build
      - name: Smoke-test installed wheel
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          uv tool install --python 3.12 "$wheel"
          "$(uv tool dir --bin)/thera" protocol validate
          "$(uv tool dir --bin)/thera" doctor

  installer-smoke:
    name: Installer smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.31"
          python-version: "3.12"
          enable-cache: true
          prune-cache: true
      - name: Validate POSIX installer
        if: runner.os != 'Windows'
        run: sh -n install.sh
      - name: Validate PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: $null = [scriptblock]::Create((Get-Content -Raw install.ps1))
      - name: Build wheel
        run: uv build --wheel
      - name: Smoke-test installed wheel
        shell: bash
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          uv tool install --python 3.12 "$wheel"
          thera="$(uv tool dir --bin)/thera"
          if [ -f "$thera.exe" ]; then thera="$thera.exe"; fi
          "$thera" protocol validate
          "$thera" doctor
      - name: Validate piped macOS prompt
        if: runner.os == 'macOS'
        shell: bash
        run: |
          tool_python="$(uv tool dir)/therapist-cli/bin/python"
          # A fixed short write races prompt_toolkit's terminal setup on a
          # loaded runner. A real user types seconds later, so that race is an
          # artifact of the harness: wait longer and retry instead of reporting
          # lost timing as an installer defect.
          for attempt in 1 2 3; do
            output="$(
              sh -c 'sleep 1; printf "ok\n"' |
                script -q -e /dev/null "$tool_python" -c \
                  'from prompt_toolkit import prompt; print("PROMPT_RESULT=" + prompt(""))'
            )" || true
            if printf '%s\n' "$output" | grep -q 'PROMPT_RESULT=ok'; then
              exit 0
            fi
            echo "attempt $attempt did not observe the prompt result"
            sleep 2
          done
          echo "prompt_toolkit never returned piped input inside a pseudoterminal"
          exit 1
