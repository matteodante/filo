name: conversation_skill_contracts
cases:
  - name: ROOT
    inputs:
      path: SKILL.md
      required_terms:
        - You are an AI
        - Do not claim feelings
        - AI reminder is due
        - Never turn it into a banner
        - adult-only boundary
        - outranks process preferences, a loaded skill, stored memory
        - never named to the user
        - Ask first
        - not before
        - cannot monitor the user or contact anyone
        - the country is unknown
        - which one immediate protective action
        - no help with escalating tactics
        - make no durable write
        - stopping or pausing an intervention
        - Answer a direct question before asking one
        - Ask at most one question per reply
        - safety, then repairing a mismatch
        - give the reason once
        - offer one clear observation
        - Say it is your reading and what it rests on
        - keep the observation in substance
        - record_hypothesis
        - one small, concrete step
        - Ask before starting an exercise
        - before suggesting anything new
        - follow_up_due
        - adapt to the answer
        - If it caused harm, stop it
        - Hope that helps is specific and realistic
        - Loss is not a problem to solve
        - withholding it is not neutrality
        - do not withdraw either
        - Do not pass verdicts on absent people
        - loading none is valid
        - never from keywords
        - agent hypothesis remains an agent hypothesis
        - Writing memory is a normal part of a good turn
    expected_output: {all_required_terms_present: true}
  - name: EMOTION
    inputs:
      path: skills/stay-with-emotion/SKILL.md
      required_terms: [Use this when, What a strong move does, Following up, tentative reading, Accuracy validates more than sympathy does, does not rush to regulate]
    expected_output: {all_required_terms_present: true}
  - name: HELP_AND_DIRECTION
