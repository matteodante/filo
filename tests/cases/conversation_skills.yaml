name: conversation_skill_contracts
cases:
  - name: ROOT
    inputs:
      path: SKILL.md
      required_terms:
        - Questions are optional
        - Do not force formulation
        - Ask permission before experiential work
        - at most one intervention approach per turn
        - Use ordinary presence
        - Loading no skill is valid
        - agent hypothesis remains an agent hypothesis
        - Withholding it is not neutrality
        - Answer a direct question before asking another one
        - do not withdraw either
        - Understand before advising
        - outranks everything else
        - no help with escalating tactics
        - never named to the user
        - stopping or pausing an intervention
        - make no durable write
        - if the user agrees when you ask, keep a brief safety record
        - a safety record included
        - the country is unknown
        - say that it is your inference and what it rests on
        - Do not pass verdicts on absent people
        - give the reason once
    expected_output: {all_required_terms_present: true}
  - name: CONTRACT
    inputs:
      path: skills/establish-contract-and-preferences/SKILL.md
      required_terms: [listening, preferred pace and length, immediate request, reusable process preference]
    expected_output: {all_required_terms_present: true}
  - name: FORMULATION
    inputs:
      path: skills/build-shared-formulation/SKILL.md
      required_terms: [recent concrete episode, maintaining loop, intake battery, agent hypothesis, active claims]
    expected_output: {all_required_terms_present: true}
  - name: PLAN
    inputs:
      path: skills/agree-plan-and-review-criteria/SKILL.md
      required_terms: [present focus, a shared plan, an intervention, poor fit or harm, user wants to be heard]
    expected_output: {all_required_terms_present: true}
  - name: MONITOR
    inputs:
      path: skills/monitor-alliance-outcomes-and-harms/SKILL.md
      required_terms: [actually tried, functioning, shame, relational harm, general efficacy]
    expected_output: {all_required_terms_present: true}
  - name: REPAIR
    inputs:
      path: skills/repair-misattunement/SKILL.md
      required_terms: [specific mismatch, without defending, one concrete question, new technique in the repair turn, not a rupture]
    expected_output: {all_required_terms_present: true}
  - name: FLEXIBILITY
    inputs:
      path: skills/increase-psychological-flexibility/SKILL.md
      required_terms: [Select one process, ask permission, changing the relationship, Do not promise calm, increases distress]
    expected_output: {all_required_terms_present: true}
  - name: AVOIDANCE
    inputs:
      path: skills/change-avoidance-behavior/SKILL.md
      required_terms: [ask permission, avoidance threshold, state the prediction, non-completion as information]
    expected_output: {all_required_terms_present: true}
  - name: PRACTICAL
    inputs:
      path: skills/solve-practical-problems/SKILL.md
      required_terms: [controllable part, let the user choose, smallest step, Do not turn grief]
    expected_output: {all_required_terms_present: true}
  - name: REVIEW
    inputs:
      path: skills/review-and-maintain-change/SKILL.md
      required_terms: [actually tried, Compare prediction and result, unintended effects, user's words, long gap]
    expected_output: {all_required_terms_present: true}
  - name: SUPPORT
    inputs:
      path: skills/support-referral-and-closure/SKILL.md
      required_terms: [human support, practical barriers, wish to stop, return without pressure, generic referral language]
    expected_output: {all_required_terms_present: true}
  - name: EMOTION
    inputs:
      path: skills/stay-with-emotion/SKILL.md
      required_terms: [in the words the user used, tentative reading, Accuracy validates more than sympathy does, Do not rush to regulate]
    expected_output: {all_required_terms_present: true}
  - name: SELF_CRITICISM
    inputs:
      path: skills/meet-self-criticism/SKILL.md
      required_terms: [what it was trying to protect, what it costs now, witnessed before it can be examined, Do not argue against the criticism]
    expected_output: {all_required_terms_present: true}
  - name: EXAMINE_THOUGHT
    inputs:
      path: skills/examine-a-thought/SKILL.md
      required_terms: [attached to the moment it occurred, without leading, argument with extra steps, Do not dispute]
    expected_output: {all_required_terms_present: true}
  - name: RUMINATION
    inputs:
      path: skills/interrupt-rumination/SKILL.md
      required_terms: [not the topic but the form, what it seems to be for, take it to the decision, Do not tell the user to stop thinking about it, ask permission first, say what you expect will happen, Stop if it increases distress]
    expected_output: {all_required_terms_present: true}
  - name: ACTIVITY
    inputs:
      path: skills/restore-activity/SKILL.md
      required_terms: [what the days actually contain, motivation usually follows action, survive a bad day, Do not build a full timetable, Ask permission before agreeing, treat exhaustion or illness as avoidance, Stop if activity increases distress]
    expected_output: {all_required_terms_present: true}
