      path: skills/agree-help-and-direction/SKILL.md
      required_terms: [Use this when, What a strong move does, Following up, present focus, a shared plan, an intervention, poor fit or harm, immediate request, reusable process preference, wants to be heard]
    expected_output: {all_required_terms_present: true}
  - name: FORMULATION
