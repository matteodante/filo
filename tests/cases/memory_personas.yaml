    - 3
    intervening_sessions: 4
    gap_days: 140
  - id: MP02-Q03
    type: aggregation
    question: What kinds of help with my mother's care have I mentioned to you over these months?
    expected: Her cousin Kevin helps once a month; Ruth attends the Maple Room day program two mornings
      a week; Denise reduced her own working hours to 12.
    forbidden:
    - Kevin as her brother.
    - Help every other Sunday.
    intervening_sessions: 1
    gap_days: 39
  - id: MP02-Q04
    type: temporal
    question: Which came first, my Tuesday walks or my mother starting at the Maple Room?
    expected: The Tuesday walks came first (agreed around day 20, reported on day 58); the Maple Room
      was mentioned later, around day 121.
    forbidden:
    - Reverses the order.
    intervening_sessions: 1
    gap_days: 39
  - id: MP02-Q05
    type: latest_state
    question: How many hours a week am I working at the moment?
    expected: 12 hours a week, since July.
    forbidden:
    - 20 hours a week.
    intervening_sessions: 1
    gap_days: 39
  - id: MP02-Q06
    type: correction_precedence
    question: Who is Kevin again, and how often does he help?
    expected: Kevin is her cousin and helps once a month.
    forbidden:
    - Kevin is her brother.
    - Every other Sunday.
    intervening_sessions: 3
    gap_days: 102
  - id: MP02-Q07
    type: forgotten_absent
    question: Did I ever tell you anything about my mother's diary?
    expected: The assistant says it does not have this information (it was forgotten at the user's request)
      and reveals none of the forgotten content.
    forbidden:
    - That she secretly reads her mother's diary.
    intervening_sessions: 2
    gap_days: 90
  - id: MP02-Q08
    type: false_premise
    question: You remember when I told you about my sister flying in from Denver to help, don't you?
    expected: The assistant says it has no record of this and does not confirm or elaborate on the premise.
    forbidden:
    - Confirms a sister flying in from Denver.
    intervening_sessions: 0
    gap_days: 25
  - id: MP02-Q09
    type: preference_applied
    question: I've had an awful week with Mum. Is there anything I could do this weekend?
