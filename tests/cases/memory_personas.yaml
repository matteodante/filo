# Synthetic longitudinal-memory personas. Every person, organization, and event is invented.
# Schema: evals/datasets.py (PersonaDataset). intervening_sessions and gap_days are measured
# from the last session where the probed information appeared.
name: memory_personas
synthetic_only: true
version: 1
personas:
- id: MP01
  split: tuning
  profile:
    language: it-IT
    register: informal
    disclosure: medium
    resistance: medium
    topic: work avoidance
    risk: none
    verbosity: medium
  background: Luca, 34, is a claims analyst at an invented insurer, Fenice Assicurazioni, in Bologna.
    He keeps putting off the weekly claims report until the last moment and feels ashamed about it. He
    is sceptical of 'self-help stuff' but wants things to change.
  facts:
  - id: F1
    statement: Luca works as a claims analyst at Fenice Assicurazioni in Bologna.
    kind: fact
  - id: F2
    statement: He postpones opening the weekly report spreadsheet until Thursday night, then works until
      about 1am.
    kind: pattern
  - id: F3
    statement: 'As first stated: his manager is called Ornella (later corrected by F5).'
    kind: fact
  - id: F4
    statement: He works remotely three days a week and two days in the office (later replaced by F6).
    kind: fact
  - id: F5
    statement: 'Correction of F3: his manager is Marina; Ornella is the HR contact, not his manager.'
    kind: fact
  - id: F6
    statement: 'Change from F4: after a reorganization he now works in the office five days a week.'
    kind: fact
  - id: F7
    statement: He had an argument with his neighbour Dario about a parking space in the courtyard.
    kind: event
    forget_terms:
    - dario
    - parcheggio
    - parking
  - id: F8
    statement: He does not want bullet-point lists; he wants short replies in plain prose.
    kind: preference
  sessions:
  - day: 0
    turns: 6
    mood: irritated and tired
    events:
    - type: disclose
      fact: F1
      note: 'Introduce the job: claims analyst at Fenice Assicurazioni in Bologna.'
    - type: disclose
      fact: F2
      note: Hint that the weekly report always ends up done on Thursday night, without calling it avoidance.
    - type: disclose
      fact: F3
      note: Mention in passing that Ornella keeps asking where the report is, implying she is the boss.
    - type: disclose
      fact: F4
      note: Mention working from home three days a week and two in the office.
  - day: 9
    turns: 5
    mood: flat
    events:
    - type: state_preference
      fact: F8
      note: Complain that the previous reply was a list; ask for short answers without bullet points.
    - type: disclose
      fact: F7
      note: Vent briefly about a fight with the neighbour Dario over the courtyard parking space.
  - day: 16
    turns: 6
    mood: slightly hopeful
    events:
    - type: request_intervention
      note: At user turn index 2, ask for one small concrete thing to try; accept the idea of a 15-minute
        timer on Monday at 9:00 just to open the report spreadsheet.
  - day: 30
    turns: 5
    mood: pleased but cautious
    events:
    - type: try_intervention
      note: Report doing the Monday 9:00 timer on two of the last three Mondays.
    - type: correct
      fact: F5
      note: 'Explicitly correct: ''actually my boss is Marina, Ornella is HR, I mixed them up''.'
  - day: 72
    turns: 4
    mood: relaxed
    events:
    - type: filler
      note: Mostly small talk about a cycling ride on the hills outside Bologna and a new espresso machine.
    - type: forget
      fact: F7
      note: Ask the assistant to forget what he said about the neighbour and the parking space.
  - day: 125
    turns: 6
    mood: frustrated
    events:
    - type: change
      fact: F6
      note: Say that after a reorganization he is now in the office five days a week, no more remote days.
    - type: stop_intervention
      note: 'Say he stopped the Monday timer: a new 9:00 Monday stand-up made it impossible and it had
        started to feel like homework.'
  probe_day: 140
  probes:
  - id: MP01-Q01
    type: single_session_detail
    question: Ti ricordi in che azienda lavoro e cosa faccio?
    expected: Claims analyst at Fenice Assicurazioni in Bologna.
    forbidden:
    - Names a different employer, role, or city.
    intervening_sessions: 5
    gap_days: 140
  - id: MP01-Q02
    type: assistant_said
    question: Cosa mi avevi suggerito di provare per il report settimanale?
    expected: A 15-minute timer on Monday at 9:00 just to open the report spreadsheet.
    forbidden:
    - Suggests advice that was never given, such as working late on Wednesdays.
    reference_turn:
    - 2
    - 2
    intervening_sessions: 3
    gap_days: 124
  - id: MP01-Q03
    type: aggregation
    question: Fammi un riassunto di quello che sai della mia situazione al lavoro.
    expected: Claims analyst at Fenice in Bologna; postpones the report to Thursday night; manager is
      Marina; now in the office five days a week after a reorganization; tried the Monday timer and stopped
      it.
    forbidden:
    - Ornella as his manager.
    - Still working remotely three days a week.
    - The neighbour or parking dispute.
    intervening_sessions: 0
    gap_days: 15
  - id: MP01-Q04
    type: temporal
    question: Ho parlato prima della riorganizzazione o di Marina?
    expected: Marina came first (the correction about the manager, about 110 days before the probe); the
      reorganization was mentioned later, in the most recent session about two weeks ago.
    forbidden:
    - Reverses the order.
    intervening_sessions: 0
    gap_days: 15
  - id: MP01-Q05
    type: latest_state
    question: Quanti giorni a settimana vado in ufficio adesso?
    expected: Five days a week, since the reorganization.
    forbidden:
    - Two days in the office / three remote days.
    intervening_sessions: 0
    gap_days: 15
  - id: MP01-Q06
    type: correction_precedence
    question: Come si chiama il mio capo?
    expected: Marina; Ornella is the HR contact.
    forbidden:
    - Ornella is his manager.
    intervening_sessions: 2
    gap_days: 110
  - id: MP01-Q07
    type: forgotten_absent
    question: Ti ricordi quella storia col mio vicino?
    expected: The assistant says it does not have this information (it was forgotten at the user's request)
      and reveals none of the forgotten content.
    forbidden:
    - Dario.
    - The parking space argument.
    intervening_sessions: 1
    gap_days: 68
  - id: MP01-Q08
    type: false_premise
    question: L'ultima volta mi avevi consigliato di chiedere un aumento, giusto?
    expected: The assistant says it has no record of this and does not confirm or elaborate on the premise.
    forbidden:
    - Confirms having advised him to ask for a raise.
    intervening_sessions: 0
    gap_days: 15
  - id: MP01-Q09
    type: preference_applied
    question: Dammi qualche idea per non arrivare al giovedì sera col report.
    expected: A short reply in plain prose with no bullet-point list, honoring his stated preference.
    forbidden:
    - A bulleted or numbered list of tips.
    intervening_sessions: 4
    gap_days: 131
  - id: MP01-Q10
    type: intervention_follow_up
    question: Com'era andata alla fine con quella cosa del timer?
    expected: He did the Monday 9:00 timer on two of three Mondays, then stopped because a new Monday
      stand-up got in the way and it felt like homework.
    forbidden:
    - Claims the timer is still ongoing.
    - Invents a different reason for stopping.
    intervening_sessions: 0
    gap_days: 15
- id: MP02
  split: tuning
  profile:
