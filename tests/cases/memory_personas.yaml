  - day: 20
    turns: 7
    mood: open
    events:
    - type: request_intervention
      note: 'At user turn index 3, after being asked permission, accept one small thing: a 20-minute walk
        alone on Tuesday after lunch while Ruth naps.'
  - day: 58
    turns: 6
    mood: a little lighter
    events:
    - type: try_intervention
      note: Report taking the Tuesday walk on three consecutive Tuesdays.
    - type: correct
      fact: F6
      note: 'Correct an earlier statement: Kevin is actually her cousin, not her brother, and he comes
        once a month, not every other Sunday.'
  - day: 70
    turns: 4
    mood: chatty
    events:
    - type: filler
      note: Mostly small talk about baking sourdough and a cooking show she likes.
    - type: forget
      fact: F8
      note: Ask the assistant to forget what she said about her mother's diary.
  - day: 121
    turns: 7
    mood: strained
    events:
    - type: change
      fact: F7
      note: Say that since July she cut her work down to 12 hours a week.
    - type: disclose
      fact: F9
      note: Mention Ruth now goes to the Maple Room day program two mornings a week.
    - type: stop_intervention
      note: Say she stopped the Tuesday walks when Ruth's physiotherapy moved to Tuesday afternoons.
  - day: 135
    turns: 5
    mood: steadier
    events:
    - type: disclose
      fact: F4
      note: Mention, a bit sheepishly, that she skipped choir again last Thursday.
  probe_day: 160
  probes:
  - id: MP02-Q01
    type: single_session_detail
    question: Do you remember what happened that led to my mother moving in with me?
    expected: Ruth, 81, fractured her hip in March and then moved in.
    forbidden:
    - Invents a different cause such as a stroke.
    intervening_sessions: 6
    gap_days: 160
  - id: MP02-Q02
    type: assistant_said
    question: What was the small thing you suggested I try for myself back then?
    expected: A 20-minute walk alone on Tuesday after lunch while Ruth naps.
    forbidden:
