      fact: F1
      note: Explain that Ruth, 81, moved in after a hip fracture in March.
    - type: disclose
      fact: F3
      note: Mention the 20-hour-a-week bookkeeping job at a dental practice.
    - type: disclose
      fact: F4
      note: Hint that she 'hasn't made it to choir in a while', without naming guilt directly.
  - day: 12
    turns: 6
    mood: tired
    events:
