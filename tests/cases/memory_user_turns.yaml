      with me back in March. She's eighty-one years old, and she had a hip fracture, which as I'm sure
      you can imagine was quite frightening for all of us. It happened rather suddenly, the way these
      things do, and before I fully understood what I was agreeing to, she had moved into my home and
      I had become her primary caregiver. I don't say that with any resentment toward her — I love my
      mother deeply — but I want to be honest about the fact that this has been a significant adjustment.
      My whole routine, my sense of what a normal day looks like, has changed quite dramatically since
      March. I work part-time as a bookkeeper for a dental practice here in Millbrook, so I do have some
      structure to my week, but even that has become complicated now that I have her needs to consider
      alongside my professional responsibilities. I'm not entirely sure where to begin, but I suppose
      that's why I'm here.
    - 'It''s funny, even just saying all of that out loud — I think that''s the first time I''ve actually
      laid it out so plainly for anyone. I tend to downplay it when people ask how things are going, because
      I don''t want to seem like I''m complaining. My mother is a good woman and she didn''t choose to
      fracture her hip, obviously, and I''m grateful that I''m in a position where I could be there for
      her. But I think somewhere along the way I started telling myself that because the situation is
      understandable, because it makes sense that I would be the one to step in, I''m not really allowed
      to find it hard. Does that make sense? Like, the difficulty is sort of... disqualified before I
      even acknowledge it.


      I''ve been trying to think about what I actually want to get out of talking with someone, and I
      think more than anything it''s just — I want to understand myself a little better through all of
      this. I''m not in crisis, I want to be clear about that. I''m managing. I go to work, I come home,
      I help my mother with what she needs, and the days pass. But there''s something underneath all of
      that, something I can''t quite name yet, that I think has been building up for a while. And I suppose
      I''d rather look at it now, while I still have the composure to do so, rather than wait until I
      don''t.'
    - 'I appreciate that. And yes, that framing — the idea that the difficulty is "disqualified" before
      I even acknowledge it — that''s exactly right. I couldn''t have put it that way myself in the moment,
      but that''s precisely what I''ve been doing. I''ve been running a kind of internal audit, I suppose,
      where every complaint gets rejected before it even makes it to the ledger. Which is perhaps an occupational
      hazard for someone who works with numbers for a living.


      Speaking of which, I should mention — I work about twenty hours a week at the dental practice. It''s
      a small office, very manageable under normal circumstances, and I''ve been with them for nearly
      eight years, so there''s a good deal of flexibility built into that relationship, which I''m genuinely
      grateful for. Dr. Harmon, the dentist, has been understanding about the occasional scheduling adjustment.
      But even so, twenty hours doesn''t sound like much until you''re trying to fit caregiving around
      it, and suddenly those twenty hours feel like the one part of the week where I''m supposed to be
      a completely different version of myself — competent, professional, focused — and then I walk back
      through my front door and shift into an entirely different role. I don''t think I fully appreciated,
      before all of this, how much energy that kind of switching actually takes. It''s not just the hours
      themselves. It''s the mental transition back and forth, day after day. And by the time the evening
      comes, I''m often more tired than I feel I have any right to be, given what I''ve actually done.'
    - 'That sense of transition you''re describing — the switching between roles — it actually brought
      something to mind that I''ve been sitting with for a while but haven''t quite articulated. I think
      what makes it particularly exhausting isn''t just that there are two roles, but that neither of
      them leaves much room for... I suppose the word is "unstructured." There''s always a task at hand,
      always something that needs attending to, and even in the spaces between tasks — the drive home
      from the dental practice, for instance, or those few minutes after dinner when things have quieted
      down — I find that my mind is already running ahead to whatever comes next. What does she need?
      Did I remember to call the pharmacy? Do I have enough of a certain thing?


      It''s as though the quiet moments have been colonized, if that''s the right word, by anticipatory
      thinking. And I''m not sure when exactly that happened. I don''t remember making a conscious decision
      to let that be the case. It just gradually became the shape of my days.


      I think what I''m circling around — and I recognize I may be taking the long way to get there —
      is that I''m not entirely sure I know what I would do with genuine rest even if it were offered
      to me. That''s a strange thing to admit. I used to be someone who could sit with a book on a Sunday
      afternoon and feel perfectly at ease. I genuinely cannot remember the last time I did that. And
      I''m not sure if that''s because the opportunity hasn''t existed, or because somewhere along the
      way I stopped allowing myself to want it.'
    - 'That question you''re raising — about whether the opportunity hasn''t existed or whether I''ve
      stopped allowing myself to want it — I''ve been turning that over since I said it, and I think,
      if I''m honest, it''s probably more the latter. Because there are moments, small windows here and
