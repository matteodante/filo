[project]
name = "filo-cli"
version = "0.3.1"
description = "Open-source AI agent for reflection with encrypted longitudinal memory"
authors = [{ name = "Matteo Dante" }]
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
keywords = ["ai", "mental-wellbeing", "pydantic-ai", "self-hosted", "telegram"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "cryptography>=50,<51",
  "httpx2>=2.13,<3",
  "huggingface-hub>=1,<2",
  "pydantic-ai-slim[anthropic,google,openai,sentence-transformers]>=2.57.0,<3",
  "pyyaml>=6,<7",
  "questionary>=2.1,<3",
  "rich>=15,<16",
  "textual>=8.2,<9",
  "torch>=2.14,<3",
]

[project.optional-dependencies]
dev = [
  "coverage>=7.15,<8",
  "pytest>=8.4,<10",
  "ruff>=0.16.1,<1",
  "ty>=0.0.89,<0.1",
]

[project.scripts]
filo = "filo.cli:main"

[project.urls]
Homepage = "https://github.com/matteodante/filo"
Repository = "https://github.com/matteodante/filo.git"
Issues = "https://github.com/matteodante/filo/issues"
Documentation = "https://github.com/matteodante/filo#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filo"]

[tool.hatch.build.targets.wheel.force-include]
"protocols/transdiagnostic" = "filo/protocols/transdiagnostic"

# The embedding model runs on CPU. Without this, Linux resolves the CUDA build of torch and pulls
# several gigabytes of NVIDIA libraries that are never used.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires real provider credentials and network access"]

[tool.coverage.run]
branch = true
source = ["filo"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[dependency-groups]
dev = [
    "pydantic-evals>=2.57.0,<3",
]
